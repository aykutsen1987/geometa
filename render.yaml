services:
  - type: web
    name: geometa-atem-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODELS
        value: qwen/qwen3.6-27b
      - key: CATALOG_URL
        sync: false
      - key: APP_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
